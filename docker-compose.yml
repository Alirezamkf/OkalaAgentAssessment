services:
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      AGENT_SERVICE_URL: ${AGENT_SERVICE_URL:-http://agent-service:8001}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    networks: [okala]

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-okala}:${POSTGRES_PASSWORD:-okala_password}@postgres:5432/${POSTGRES_DB:-okala_assessment}
      AGENT_SERVICE_URL: http://agent-service:8001
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    networks: [okala]

  agent-service:
    build: ./agents/agent_service
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [okala]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-okala_assessment}
      POSTGRES_USER: ${POSTGRES_USER:-okala}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-okala_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [okala]

networks:
  okala:
    driver: bridge

volumes:
  postgres_data:
