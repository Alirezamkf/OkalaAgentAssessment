name: Candidate Invitation Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  candidate-invitation-tests:
    name: Issues #78 and #79 tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest httpx

      - name: Run invitation token and candidate schema tests
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
        run: python -m pytest tests/test_invitation_token.py tests/test_candidate_schemas.py -v
