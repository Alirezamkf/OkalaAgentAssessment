name: Candidate Invitation Tests

on:
  push:
    branches:
      - maedeh/frontend-hr-dashboard
  workflow_dispatch:

jobs:
  candidate-invitation-tests:
    name: Issues #78 and #79 tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install shared Okala AI contract package
        run: python -m pip install -e ../shared

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run invitation token and candidate schema tests
        run: python -m pytest tests/test_invitation_token.py tests/test_candidate_schemas.py -v
